<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="com.fogpass.Core"/>
    <allow send_destination="com.fogpass.Core"/>
    <allow receive_sender="com.fogpass.Core"/>
  </policy>

  <!-- Allow anyone (like the UI user) to receive signals from Core -->
  <policy context="default">
    <allow send_destination="com.fogpass.Core"/>
    <allow receive_sender="com.fogpass.Core"/>
  </policy>
</busconfig>